<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿联酋 MVAS 实时买量转化看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; margin: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .refresh-btn { background-color: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .refresh-btn:hover { background-color: #059669; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .stat-card { background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 20px; text-align: center; }
        .stat-card h3 { margin: 0; color: #888; font-size: 14px; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0 0; font-size: 32px; font-weight: bold; }
        .success { color: #10b981; }
        .failed { color: #ef4444; }
        .pending { color: #f59e0b; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2d2d2d; font-size: 14px; }
        th { background-color: #2a2a2a; color: #aaa; }
        tr:hover { background-color: #252525; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🇦🇪 Etisalat 实时数据大盘</h2>
        <button class="refresh-btn" onclick="fetchData()">🔄 刷新数据</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>总发码请求 (Hits)</h3>
            <p id="total-hits">0</p>
        </div>
        <div class="stat-card">
            <h3>成功订阅 (Verified)</h3>
            <p id="total-success" class="success">0</p>
        </div>
        <div class="stat-card">
            <h3>验证失败 (Failed)</h3>
            <p id="total-failed" class="failed">0</p>
        </div>
        <div class="stat-card">
            <h3>综合转化率 (CR)</h3>
            <p id="cr-rate">0.00%</p>
        </div>
    </div>

    <h3>📋 实时转化流水（最新50笔）</h3>
    <table>
        <thead>
            <tr>
                <th>时间 (GMT)</th>
                <th>手机号</th>
                <th>运营商</th>
                <th>Voluum ClickID</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody id="data-rows"></tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://krcbbiitqkmlcoryedes.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyY2JiaWl0qWttbGNvcnllZGVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzUxMDgsImV4cCI6MjA5NTQ1MTEwOH0.il63duhVsujomyvWWcsOK_Jjbn9k5lkbBH0Ev4Dm5s4"; 
        
        // 💥 终极修复：右侧改用大写 S 的官方标准类名，彻底解决卡死冲突！
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchData() {
            try {
                // 1. 从 Supabase 拉取最新 50 笔数据
                const { data, error } = await supabase
                    .from('conversions')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                // 2. 算盘计算各项 KPI（增加了空安全保障）
                let total = data ? data.length : 0;
                let success = data ? data.filter(r => r.status === 'verified').length : 0;
                let failed = data ? data.filter(r => r.status === 'failed').length : 0;
                let cr = total > 0 ? ((success / total) * 100).toFixed(2) : '0.00';

                // 3. 渲染卡片数字
                document.getElementById('total-hits').innerText = total;
                document.getElementById('total-success').innerText = success;
                document.getElementById('total-failed').innerText = failed;
                document.getElementById('cr-rate').innerText = cr + '%';

                // 4. 渲染表格明细
                const tbody = document.getElementById('data-rows');
                tbody.innerHTML = '';
                
                if (data && total > 0) {
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        
                        // 格式化时间
                        const date = row.created_at ? new Date(row.created_at).toISOString().replace('T', ' ').substring(0, 19) : '未知';
                        
                        // 状态兼容性高亮（转大写防错）
                        const currentStatus = (row.status || 'PENDING').toLowerCase();
                        let statusClass = 'pending';
                        if (currentStatus === 'verified' || currentStatus === 'success') statusClass = 'success';
                        if (currentStatus === 'failed') statusClass = 'failed';

                        tr.innerHTML = `
                            <td>${date}</td>
                            <td>${row.msisdn || '未知'}</td>
                            <td>${row.carrier || 'Etisalat'}</td>
                            <td style="font-family:monospace; font-size:12px;">${row.click_id || '无'}</td>
                            <td class="${statusClass}"><b>${currentStatus.toUpperCase()}</b></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666;">暂无流水数据</td></tr>';
                }

            } catch (e) {
                console.error("加载看板失败:", e.message);
                alert("看板数据加载失败，请检查配置！原因: " + e.message);
            }
        }

        // 页面加载自动跑一次
        window.onload = fetchData;
    </script>
</body>
</html>
