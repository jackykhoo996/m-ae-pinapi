<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAE MVAS - Real-time Performance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; padding-bottom: 16px; }
        .header h2 { font-size: 20px; font-weight: 600; color: #f0f6fc; display: flex; align-items: center; gap: 10px; }
        .refresh-btn { background-color: #238636; color: #ffffff; border: 1px solid rgba(240,246,252,0.1); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        .refresh-btn:hover { background-color: #2ea44f; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
        .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 24px; text-align: center; }
        .stat-card h3 { margin: 0; color: #8b949e; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card p { margin: 12px 0 0 0; font-size: 32px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace; }
        .success { color: #3fb950; }
        .failed { color: #f85149; }
        .pending { color: #d29922; }
        h3.table-title { margin-top: 36px; font-size: 16px; font-weight: 600; color: #f0f6fc; }
        .table-container { width: 100%; overflow-x: auto; border: 1px solid #30363d; border-radius: 6px; margin-top: 12px; background: #161b22; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #21262d; }
        th { background-color: #161b22; color: #8b949e; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #1f242c; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-success { background: rgba(63,185,80,0.15); color: #3fb950; }
        .badge-failed { background: rgba(248,81,73,0.15); color: #f85149; }
        .badge-pending { background: rgba(210,153,34,0.15); color: #d29922; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🇦🇪 Etisalat UAE - Live Conversion Funnel</h2>
        <button class="refresh-btn" onclick="fetchData()">🔄 Refresh Data</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Hits (PIN Req)</h3>
            <p id="total-hits">0</p>
        </div>
        <div class="stat-card">
            <h3>Verified Conv.</h3>
            <p id="total-success" class="success">0</p>
        </div>
        <div class="stat-card">
            <h3>Failed Attempt</h3>
            <p id="total-failed" class="failed">0</p>
        </div>
        <div class="stat-card">
            <h3>Conversion Rate (CR)</h3>
            <p id="cr-rate">0.00%</p>
        </div>
    </div>

    <h3 class="table-title">📋 Real-time Conversion Logs (Latest 50 Hits)</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Timestamp (GMT)</th>
                    <th>Cleaned MSISDN</th>
                    <th>Carrier</th>
                    <th>Voluum ClickID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="data-rows">
                <tr>
                    <td colspan="5" style="text-align:center; color:#8b949e; padding: 24px;">Initializing connection to Supabase...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 💥 Verified Match: Paired with your real UAE project ID (qocrghvrnbppvyeukyyr)
        const SUPABASE_URL = "https://qocrghvrnbppvyeukyyr.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvY3JnaHZybmJwcHZ5ZXVreXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3打O3M2Y2NzYsImV4cCI6MjA5NTk0NDY3Nn0.tXDe27x41dcHDm5JAFJxR1_q04PK9RovI5UjaBS2Dpw"; 
        
        // Anti-collision declaration
        const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchData() {
            try {
                // 1. Fetch records from conversions table
                const { data, error } = await dbClient
                    .from('conversions')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                // 2. Data calculation
                let total = data ? data.length : 0;
                let success = data ? data.filter(r => r.status === 'verified' || r.status === 'success').length : 0;
                let failed = data ? data.filter(r => r.status === 'failed').length : 0;
                let cr = total > 0 ? ((success / total) * 100).toFixed(2) : '0.00';

                // 3. Render Metric Cards
                document.getElementById('total-hits').innerText = total;
                document.getElementById('total-success').innerText = success;
                document.getElementById('total-failed').innerText = failed;
                document.getElementById('cr-rate').innerText = cr + '%';

                // 4. Render Log Data Rows
                const tbody = document.getElementById('data-rows');
                tbody.innerHTML = '';
                
                if (data && total > 0) {
                    data.forEach(row => {
                        const tr = document.createElement('tr');
                        
                        // Time formatting
                        const date = row.created_at ? new Date(row.created_at).toISOString().replace('T', ' ').substring(0, 19) : 'N/A';
                        
                        // High-standard Status Badges
                        const currentStatus = (row.status || 'PENDING').toLowerCase();
                        let statusClass = 'badge-pending';
                        let statusText = 'PENDING';
                        
                        if (currentStatus === 'verified' || currentStatus === 'success') {
                            statusClass = 'badge-success';
                            statusText = 'VERIFIED';
                        } else if (currentStatus === 'failed') {
                            statusClass = 'badge-failed';
                            statusText = 'FAILED';
                        }

                        tr.innerHTML = `
                            <td style="font-family: monospace; color: #8b949e;">${date}</td>
                            <td style="font-weight: 600; color: #c9d1d9;">${row.msisdn || 'Unknown'}</td>
                            <td><span style="color: #58a6ff;">●</span> ${row.carrier || 'Etisalat'}</td>
                            <td style="font-family: monospace; font-size: 12px; color: #8b949e;">${row.click_id || 'direct_traffic'}</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#8b949e; padding: 24px;">No traffic records found in conversions table.</td></tr>';
                }

            } catch (e) {
                console.error("Dashboard core error:", e.message);
                alert("Data load aborted: " + e.message);
            }
        }

        // Auto initialization
        window.onload = fetchData;
    </script>
</body>
</html>
